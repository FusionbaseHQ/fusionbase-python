[tool.poetry]
name = "fusionbase"
version = "0.3.0"
description = "This is the main Fusionbase python package to make handling and interacting with data a piece of cake."
authors = ["Fusionbase <info@fusionbase.com>"]
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/FusionbaseHQ/fusionbase-python"
documentation = "https://developer.fusionbase.com/docs/developer-sdk/python"
homepage = "https://fusionbase.com"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[tool.poetry.dependencies]
python = "^3.9"
requests-toolbelt = "^1.0.0"
httpx = "^0.27.0"
loguru = "^0.7.2"
pydantic = "^2.6.3"
diskcache = "^5.6.3"  # Cross-platform disk and memory caching
tenacity = "^8.2.3"   # Retry library with exponential backoff
platformdirs = "^4.3.0"  # OS-appropriate paths for cache/data directories

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.6"  # Added for async tests
yapf = "^0.40.0"
isort = "^5.12.0"
pylint = "^3.3.0"
pre-commit = "^3.3.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "google"
line_length = 88

[tool.pytest.ini_options]
addopts = "--no-header --no-summary -xvs"
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"  # Added for pytest-asyncio
markers = [
    "asyncio: mark a test as an asyncio coroutine",
]

[tool.yapf]
based_on_style = "google"
indent_width = 4
column_limit = 88  # Changed to match pylint and isort for consistency

[tool.pylint]
max-line-length = 88
fail-under = 7.5  # Allow commits with minor issues, but maintain quality standards
fail-on = "E"  # Only fail on errors, not warnings or conventions
ignore = []
disable = [
    "C0111", # missing docstring
    "R0903", # too few public methods
    "C0103", # invalid name
    "R0913", # too many arguments
    "R0914", # too many local variables
    "R0917", # too many positional arguments
    "R0911", # too many return statements
    "C0301", # line too long
    "C0415", # import outside toplevel
    "W0212", # protected-access
    "E1101", # no-member (false positive with pydantic)
    "W0718", # broad-exception-caught
    "R0902", # too-many-instance-attributes
    "W0707", # raise-missing-from
]
extension-pkg-whitelist = "pydantic"
good-names = ["i", "j", "k", "ex", "Run", "_", "id", "e", "f", "T"]
