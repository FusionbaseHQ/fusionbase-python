name: Tests

on:
  - push
  - pull_request

jobs:
  build:
    strategy:
      matrix:
        python-version: [3.9, "3.10", "3.11"]
    runs-on: ubuntu-latest

    steps:
        - name: Checkout
          uses: actions/checkout@v3
          with:
            fetch-depth: 0

        - name: Set up Python ${{ matrix.python-version }}
          uses: actions/setup-python@v4
          with:
            python-version: ${{ matrix.python-version }}

        - name: Install Poetry
          uses: snok/install-poetry@v1
          with:
            version: 1.5.1
            virtualenvs-create: true
            virtualenvs-in-project: true

        - name: Install dependencies
          run: |
            poetry install --no-interaction

        - name: Lint with pylint
          run: |
            output=$(poetry run pylint fusionbase --exit-zero)
            echo "$output"
            score=$(echo "$output" | grep -oP "rated at \K[\d.]+" | head -1)
            echo "Pylint score: $score (minimum: 7.5)"
            if (( $(echo "$score < 7.5" | bc -l) )); then
              echo "::error::Pylint score $score is below minimum threshold of 7.5"
              exit 1
            fi

        - name: Check import sorting with isort
          run: |
            poetry run isort --check --profile google fusionbase/ tests/

        - name: Check formatting with yapf
          run: |
            poetry run yapf --style google --diff --recursive fusionbase/ tests/

        - name: Run unit tests
          run: |
            poetry run pytest --no-header --no-summary -xvs tests/
          env:
            FUSIONBASE_API_KEY: ${{ secrets.FUSIONBASE_API_KEY }}
            FUSIONBASE_API_URI: ${{ secrets.FUSIONBASE_API_URI }}
            GENERIC_STREAM_KEY: ${{ secrets.GENERIC_STREAM_KEY }}
            EDITABLE_STREAM_LABEL: ${{ secrets.EDITABLE_STREAM_LABEL }}
            GENERIC_SERVICE_KEY: ${{ secrets.GENERIC_SERVICE_KEY }}
            GENERIC_STREAM_KEY_DEFAULT_USER_FULL_ACCESS: ${{ secrets.GENERIC_STREAM_KEY_DEFAULT_USER_FULL_ACCESS }}
            FUSIONBASE_API_KEY_GENERIC_USER: ${{ secrets.FUSIONBASE_API_KEY_GENERIC_USER }}
